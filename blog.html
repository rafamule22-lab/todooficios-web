<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="blogPageTitle">Blog | TodoOficios.es</title>
<meta name="description" id="blogPageDesc" content="Consejos y guías para elegir profesionales de oficios, reformas y mantenimiento del hogar, por TodoOficios.es.">
<link rel="canonical" href="https://todooficios.es/blog.html">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="assets/icon-512.png" type="image/png" sizes="512x512">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="legal-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#141412; --ink-soft:#4a4842; --paper:#FFFFFF; --paper-light:#F3F3F1;
    --amber:#F2B705; --amber-deep:#D9A400; --line:rgba(20,20,18,0.15);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper-light);color:var(--ink);line-height:1.6;}
  h1,h2{font-family:'Space Grotesk',sans-serif;margin:0;}
  a{color:inherit;}
  .blog-top{background:var(--ink);color:var(--paper-light);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .blog-top a.blog-home{text-decoration:none;border:1px solid rgba(247,245,240,0.25);border-radius:7px;padding:8px 12px;font-size:13px;white-space:nowrap;}
  .blog-top a.blog-home:hover{background:rgba(247,245,240,0.1);}
  .blog-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;gap:9px;}
  .blog-brand .mic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;width:26px;height:26px;background:var(--amber);flex-shrink:0;}
  .blog-brand .mic svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .blog-wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px;}
  .blog-hero{text-align:center;padding:16px 8px 28px;}
  .blog-hero h1{font-size:1.7rem;margin-bottom:8px;}
  .blog-hero p{color:var(--ink-soft);font-size:0.95rem;}
  .blog-back{display:inline-flex;align-items:center;gap:6px;margin:0 0 18px;background:none;border:none;color:var(--ink-soft);font-size:14px;cursor:pointer;padding:6px 0;font-family:inherit;text-decoration:none;}
  .blog-back:hover{color:var(--ink);}
  .blog-list{display:flex;flex-direction:column;gap:14px;}
  .blog-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;transition:transform .12s, box-shadow .12s;}
  .blog-card:hover, .blog-card:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,0.10);outline:2px solid var(--amber);}
  .blog-card-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--amber-deep);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;}
  .blog-card h2{font-size:1.1rem;margin-bottom:6px;}
  .blog-card p{color:var(--ink-soft);font-size:14px;margin:0;}
  .blog-empty, .blog-error{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--ink-soft);}
  .blog-article{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 24px;}
  .blog-article-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--amber-deep);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:10px;}
  .blog-article h1{font-size:1.5rem;margin-bottom:16px;}
  .blog-article-body h2{font-size:1.15rem;margin:22px 0 10px;}
  .blog-article-body p{margin:0 0 14px;}
  .blog-article-body ul{margin:0 0 14px;padding-left:22px;}
  .blog-article-body li{margin-bottom:6px;}
  .blog-cta{margin-top:26px;padding:16px;background:var(--paper-light);border-radius:10px;text-align:center;}
  .blog-cta a{display:inline-block;margin-top:8px;background:var(--amber);color:var(--ink);font-weight:600;padding:10px 16px;border-radius:8px;text-decoration:none;}
  .blog-cta a:hover{background:var(--amber-deep);}
</style>
</head>
<body>
  <div class="blog-top">
    <span class="blog-brand"><span class="mic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="M7 9h6M7 12.5h6M7 16h4"/><path d="M16.5 9h1M16.5 12.5h1"/></svg></span>Blog TodoOficios.es</span>
    <a class="blog-home" href="index.html">← Volver a TodoOficios.es</a>
  </div>
  <main class="blog-wrap">
    <div id="blogList">
      <div class="blog-hero">
        <h1>Consejos para tu reforma y tu hogar</h1>
        <p>Guías prácticas para elegir bien al profesional que necesitas.</p>
      </div>
      <div id="blogListBody"></div>
    </div>
    <div id="blogArticle" style="display:none;">
      <a class="blog-back" href="#" id="blogBackLink">← Volver al blog</a>
      <div id="blogArticleBody"></div>
    </div>
  </main>
  <script>
    (function(){
      "use strict";
      var elList = document.getElementById('blogList');
      var elListBody = document.getElementById('blogListBody');
      var elArticle = document.getElementById('blogArticle');
      var elArticleBody = document.getElementById('blogArticleBody');

      function escapeHtml(s){
        return String(s).replace(/[&<>"']/g, function(c){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }
      function formatDate(iso){
        try {
          return new Date(iso).toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});
        } catch(e){ return ''; }
      }

      function getClient(){
        var legal = window.TODOOFICIOS_LEGAL || {};
        if(!window.supabase || !window.supabase.createClient) return null;
        if(!legal.supabaseUrl || legal.supabaseUrl.indexOf('PENDIENTE_') !== -1) return null;
        if(!legal.supabaseAnonKey || legal.supabaseAnonKey.indexOf('PENDIENTE_') !== -1) return null;
        return window.supabase.createClient(legal.supabaseUrl, legal.supabaseAnonKey);
      }

      function showView(name){
        elList.style.display = name === 'list' ? '' : 'none';
        elArticle.style.display = name === 'article' ? '' : 'none';
        window.scrollTo(0,0);
      }

      function renderListState(html){
        elListBody.innerHTML = html;
      }

      function cardHTML(post){
        return '<div class="blog-card" data-slug="' + escapeHtml(post.slug) + '" tabindex="0" role="button">' +
          '<div class="blog-card-meta">' + escapeHtml(post.category) + ' · ' + formatDate(post.published_at) + '</div>' +
          '<h2>' + escapeHtml(post.title) + '</h2>' +
          '<p>' + escapeHtml(post.excerpt) + '</p></div>';
      }

      function renderList(posts){
        if(posts.length === 0){
          renderListState('<div class="blog-empty">Aún no hay artículos publicados. Vuelve pronto.</div>');
          return;
        }
        elListBody.innerHTML = '<div class="blog-list">' + posts.map(cardHTML).join('') + '</div>';
        Array.prototype.forEach.call(elListBody.querySelectorAll('[data-slug]'), function(node){
          node.addEventListener('click', function(){ goToArticle(node.getAttribute('data-slug')); });
          node.addEventListener('keydown', function(e){ if(e.key === 'Enter') goToArticle(node.getAttribute('data-slug')); });
        });
      }

      function articleHTML(post){
        return '<article class="blog-article">' +
          '<div class="blog-article-meta">' + escapeHtml(post.category) + ' · ' + formatDate(post.published_at) + '</div>' +
          '<h1>' + escapeHtml(post.title) + '</h1>' +
          '<div class="blog-article-body">' + post.content_html + '</div>' +
          '<div class="blog-cta">¿Necesitas un ' + escapeHtml((post.oficio || '').toLowerCase()) + ' de confianza cerca de ti?' +
          '<br><a href="index.html">Buscar en TodoOficios.es</a></div>' +
          '</article>';
      }

      var client = null;

      function goToArticle(slug){
        if(!client){ return; }
        client.from('blog_posts').select('*').eq('slug', slug).eq('status', 'published').maybeSingle()
          .then(function(res){
            if(res.error || !res.data){
              elArticleBody.innerHTML = '<div class="blog-error">No se pudo cargar este artículo.</div>';
              showView('article');
              return;
            }
            var post = res.data;
            elArticleBody.innerHTML = articleHTML(post);
            document.title = post.title + ' | Blog TodoOficios.es';
            var descTag = document.getElementById('blogPageDesc');
            if(descTag) descTag.setAttribute('content', post.meta_description || '');
            showView('article');
            history.replaceState(null, '', '#post-' + slug);
          });
      }

      function loadList(){
        if(!client){
          renderListState('<div class="blog-empty">El blog todavía se está configurando. Vuelve pronto.</div>');
          return;
        }
        client.from('blog_posts').select('*').eq('status', 'published').order('published_at', {ascending:false})
          .then(function(res){
            if(res.error){
              renderListState('<div class="blog-error">No se pudieron cargar los artículos. Inténtalo más tarde.</div>');
              return;
            }
            renderList(res.data || []);
          });
      }

      function init(){
        client = getClient();
        document.getElementById('blogBackLink').addEventListener('click', function(e){
          e.preventDefault();
          history.replaceState(null, '', location.pathname);
          showView('list');
        });
        loadList();
        showView('list');
        var hash = location.hash.replace('#','');
        if(hash.indexOf('post-') === 0) goToArticle(hash.slice(5));
      }

      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
</body>
</html>
