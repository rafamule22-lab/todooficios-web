<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141412">
<title>TodoOficios.es | Muy pronto</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #141412;
    color: #f5f3ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .logo {
    width: 88px;
    height: 88px;
    object-fit: contain;
    margin-bottom: 1.75rem;
    border-radius: 18px;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin: 0 0 0.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p {
    max-width: 32rem;
    margin: 0 auto 0.5rem;
    color: #c9c6bd;
    line-height: 1.6;
    font-size: 1.05rem;
  }
  a {
    color: #f5f3ee;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .footer {
    margin-top: 2.5rem;
    font-size: 0.85rem;
    color: #8a877e;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/logo.png" alt="TodoOficios.es">
    <h1>Estamos preparando TodoOficios.es</h1>
    <p>Muy pronto podrás encontrar aquí profesionales de oficios verificados cerca de ti. Estamos dando los últimos retoques.</p>
    <p>¿Necesitas contactarnos mientras tanto? Escríbenos a <a href="mailto:contacto@todooficios.es">contacto@todooficios.es</a></p>
    <div class="footer">&copy; 2026 TodoOficios.es</div>
  </div>
</body>
</html>
